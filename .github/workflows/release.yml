name: Release & Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version to test (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      dry_run:
        description: "Dry run (test build & changelog only, do NOT publish to PyPI or create release)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Release & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Effective Tag & Mode
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${{ github.ref_name }}"
            DRY_RUN="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Running for tag: $TAG (dry_run: $DRY_RUN)"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build sdist and wheel
        run: uv build

      - name: Generate Changelog Notes
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const currentTag = '${{ steps.config.outputs.tag }}';
            let releaseNotesBody = '';

            try {
              const { data: releaseNotes } = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: currentTag,
              });
              releaseNotesBody = releaseNotes.body || '';
            } catch (err) {
              core.warning(`Standard generateReleaseNotes note: ${err.message}`);
            }

            let body = releaseNotesBody.trim();

            // Extract default "Full Changelog" URL if present
            let compareUrl = '';
            const fullChangelogMatch = body.match(/\*\*Full Changelog\*\*:\s*(\S+)/);
            if (fullChangelogMatch) {
              compareUrl = fullChangelogMatch[1];
              body = body.replace(/\*\*Full Changelog\*\*:\s*\S+\s*/, '').trim();
            }

            try {
              // Fetch tag history to determine commit range
              const tagsRes = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 30
              });
              const tags = tagsRes.data;
              const currentIndex = tags.findIndex(t => t.name === currentTag);
              const baseTag = (currentIndex !== -1 && currentIndex + 1 < tags.length)
                ? tags[currentIndex + 1].name
                : null;

              let commits = [];
              if (baseTag) {
                const comp = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: baseTag,
                  head: currentTag
                });
                commits = comp.data.commits;
              } else {
                const list = await github.rest.repos.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: (context.sha || currentTag || 'HEAD'),
                  per_page: 100
                });
                commits = list.data;
              }

              // If standard generateReleaseNotes was empty or had no list items (e.g. initial release or direct commits without PRs)
              if (!body.includes('- ') && !body.includes('* ')) {
                const feats = [];
                const fixes = [];
                const others = [];

                for (const c of commits) {
                  const firstLine = c.commit?.message?.split('\n')[0]?.trim() || '';
                  if (!firstLine || firstLine.startsWith('Bump version') || firstLine.startsWith('Merge ') || firstLine.startsWith('chore(release)')) {
                    continue;
                  }

                  const shortSha = c.sha ? c.sha.substring(0, 7) : '';
                  const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${c.sha}`;
                  const link = `[\`${shortSha}\`](${commitUrl})`;

                  const convMatch = firstLine.match(/^(feat|fix|perf|refactor|chore|docs|test|ci|style)(?:\(([^)]+)\))?:\s*(.+)$/i);
                  if (convMatch) {
                    const type = convMatch[1].toLowerCase();
                    const scope = convMatch[2];
                    const msg = convMatch[3];
                    const item = scope ? `- **${scope}:** ${msg} in ${link}` : `- ${msg} in ${link}`;

                    if (type === 'feat') feats.push(item);
                    else if (type === 'fix') fixes.push(item);
                    else others.push(item);
                  } else {
                    others.push(`- ${firstLine} in ${link}`);
                  }
                }

                let generatedSections = [];
                if (feats.length > 0) generatedSections.push(`### 🎧 Features\n${feats.join('\n')}`);
                if (fixes.length > 0) generatedSections.push(`### 🩹 Fixes\n${fixes.join('\n')}`);
                if (others.length > 0) generatedSections.push(`### ⚙️ Chore\n${others.join('\n')}`);

                body = generatedSections.join('\n\n');
              } else {
                // Clean up standard PR bullet points
                body = body
                  .split('\n')
                  .map(line => {
                    if (/^[\*\-]\s+/.test(line)) {
                      let cleaned = line.replace(/^[\*\-]\s+/, '- ');
                      const convMatch = cleaned.match(/^- (?:feat|fix|perf|refactor|chore|docs|test|ci|style)(?:\(([^)]+)\))?:\s*(.+)$/i);
                      if (convMatch) {
                        const scope = convMatch[1];
                        const rest = convMatch[2];
                        cleaned = scope ? `- **${scope}:** ${rest}` : `- ${rest}`;
                      }
                      cleaned = cleaned.replace(/\s+by\s+@[\w\-\[\]]+\s+in\s+/i, ' in ');
                      return cleaned;
                    }
                    return line;
                  })
                  .join('\n');
              }

              // Contributors
              const contributorsMap = new Map();
              for (const c of commits) {
                const login = c.author?.login;
                const name = c.commit?.author?.name;
                if (!login || login.includes('[bot]') || login === 'github-actions') continue;
                if (!contributorsMap.has(login)) {
                  contributorsMap.set(login, name || login);
                }
              }

              if (contributorsMap.size > 0) {
                const listStr = Array.from(contributorsMap.entries())
                  .map(([login, name]) => `${name} ([@${login}](https://github.com/${login}))`)
                  .join(' · ');

                body += `\n\n### 💜 Contributors\n${listStr}`;
              }

              // Compare link
              if (compareUrl || baseTag) {
                const targetUrl = compareUrl || `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${baseTag}...${currentTag}`;
                const label = `Changes ${baseTag} → ${currentTag}`;
                body += `\n\n---\n📖 [${label}](${targetUrl})\n`;
              }
            } catch (err) {
              core.warning(`Could not format release notes: ${err.message}`);
            }

            core.setOutput('body', body.trim());

      - name: Preview Changelog in Job Log
        run: |
          echo "================ PREVIEW CHANGELOG ================"
          echo "${{ steps.changelog.outputs.body }}"
          echo "==================================================="

      - name: Create GitHub Release
        if: steps.config.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        if: steps.config.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
