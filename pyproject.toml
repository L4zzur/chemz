[project]
name = "chemz"
version = "0.1.0"
description = "Ergonomic, strictly-typed audio metadata & cover art manager (MP3, FLAC)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Popov Nikita", email = "popovnikita01@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.48.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["chemz"]
combine-as-imports = true
lines-after-imports = 2


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
